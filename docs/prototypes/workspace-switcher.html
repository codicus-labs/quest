<style>
  #quest-workspace-prototype .quest-window {
    color-scheme: light dark;
    --quest-bg: light-dark(#faf8f5, #151518);
    --quest-bar: light-dark(#fffdfa, #202024);
    --quest-line: light-dark(#e6e0d7, #38373d);
    --quest-text: light-dark(#26232a, #f1eff4);
    --quest-muted: light-dark(#655f69, #b0aab5);
    --quest-selected: light-dark(#eee5d8, #38313d);
    --quest-marker: light-dark(#805325, #edb97a);
    min-height: 328px;
    border: 1px solid var(--quest-line);
    border-radius: 13px;
    background: var(--quest-bg);
    color: var(--quest-text);
    font: 14px/1.4 system-ui, sans-serif;
  }

  #quest-workspace-prototype .quest-bar,
  #quest-workspace-prototype .quest-tabs {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  #quest-workspace-prototype .quest-bar {
    padding: 10px 13px;
    border-bottom: 1px solid var(--quest-line);
    border-radius: 13px 13px 0 0;
    background: var(--quest-bar);
  }

  #quest-workspace-prototype .quest-brand { font-weight: 650; margin-right: 4px; }
  #quest-workspace-prototype .quest-spacer { flex: 1; }
  #quest-workspace-prototype .quest-tabs span { padding: 6px 8px; color: var(--quest-muted); }
  #quest-workspace-prototype .quest-tabs [aria-current] {
    border-radius: 6px;
    background: var(--quest-selected);
    color: var(--quest-text);
  }

  #quest-workspace-prototype .quest-picker { position: relative; }
  #quest-workspace-prototype .quest-picker summary {
    display: flex;
    align-items: center;
    gap: 7px;
    width: fit-content;
    padding: 6px 9px;
    border: 1px solid var(--quest-line);
    border-radius: 7px;
    cursor: pointer;
    list-style: none;
  }

  #quest-workspace-prototype .quest-picker summary::-webkit-details-marker { display: none; }
  #quest-workspace-prototype .quest-picker summary i,
  #quest-workspace-prototype .quest-picker summary svg { width: 14px; height: 14px; }
  #quest-workspace-prototype .quest-popup {
    position: absolute;
    z-index: 2;
    inset: calc(100% + 6px) auto auto 0;
    width: 176px;
    padding: 6px;
    border: 1px solid var(--quest-line);
    border-radius: 9px;
    background: var(--quest-bar);
    box-shadow: 0 7px 19px light-dark(#332d211c, #0006);
  }

  #quest-workspace-prototype .quest-popup button {
    display: block;
    width: 100%;
    padding: 7px 9px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  #quest-workspace-prototype .quest-popup button:is(:hover, [aria-pressed="true"]) {
    background: var(--quest-selected);
  }

  #quest-workspace-prototype .quest-popup hr { margin: 5px 0; border: 0; border-top: 1px solid var(--quest-line); }
  #quest-workspace-prototype .quest-body { padding: 20px 24px; }
  #quest-workspace-prototype .quest-body h2 { margin: 0 0 9px; color: inherit; font: 600 24px/1.3 system-ui, sans-serif; }
  #quest-workspace-prototype .quest-body .quest-picker { margin-bottom: 14px; }
  #quest-workspace-prototype .quest-plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  #quest-workspace-prototype .quest-day { border-top: 1px solid var(--quest-line); min-width: 0; padding-top: 10px; }
  #quest-workspace-prototype .quest-day strong { font-weight: 600; }
  #quest-workspace-prototype .quest-day p { margin: 8px 0 0; color: var(--quest-muted); overflow-wrap: anywhere; }
  #quest-workspace-prototype .quest-day p:not(:empty) { border-left: 2px solid var(--quest-marker); padding-left: 7px; }

  @media (max-width: 550px) {
    #quest-workspace-prototype .quest-tabs { order: 3; flex-basis: 100%; }
    #quest-workspace-prototype .quest-body { padding-inline: 13px; }
  }
</style>
<div id="quest-workspace-prototype" class="viz-carousel" aria-label="Workspace-Switcher in Quest" data-previous-label="Vorherige Variante" data-next-label="Nächste Variante">
  <section data-variant="Links in der Hauptleiste" aria-label="Workspace in der Hauptleiste">
    <div class="quest-window">
      <header class="quest-bar">
        <span class="quest-brand">Quest</span>
        <div data-quest-picker></div>
        <div class="quest-tabs" aria-label="Hauptnavigation">
          <span>Home</span><span aria-current="page">Plan</span><span>Calendar</span><span>Focus</span><span>Quests</span><span>Review</span>
        </div>
        <span class="quest-spacer"></span><span aria-label="Suche">⌘K</span>
      </header>
      <div class="quest-body">
        <h2>Plan</h2>
        <div class="quest-plan" aria-live="polite">
          <div class="quest-day"><strong>Heute</strong><p data-task></p></div>
          <div class="quest-day"><strong>Morgen</strong><p data-task></p></div>
          <div class="quest-day"><strong>Donnerstag</strong></div>
        </div>
      </div>
    </div>
  </section>
  <section data-variant="Eigene Kontextzeile" aria-label="Workspace in eigener Zeile" hidden>
    <div class="quest-window">
      <header class="quest-bar">
        <span class="quest-brand">Quest</span>
        <div class="quest-tabs" aria-label="Hauptnavigation">
          <span>Home</span><span aria-current="page">Plan</span><span>Calendar</span><span>Focus</span><span>Quests</span><span>Review</span>
        </div>
        <span class="quest-spacer"></span><span aria-label="Suche">⌘K</span>
      </header>
      <div class="quest-body">
        <div data-quest-picker></div>
        <h2>Plan</h2>
        <div class="quest-plan" aria-live="polite">
          <div class="quest-day"><strong>Heute</strong><p data-task></p></div>
          <div class="quest-day"><strong>Morgen</strong><p data-task></p></div>
          <div class="quest-day"><strong>Donnerstag</strong></div>
        </div>
      </div>
    </div>
  </section>
</div>
<template id="quest-workspace-picker-template">
  <details class="quest-picker">
    <summary aria-label="Workspace wechseln">
      <i data-lucide="layers" aria-hidden="true"></i>
      <span data-current-workspace></span>
      <i data-lucide="chevron-down" aria-hidden="true"></i>
    </summary>
    <div class="quest-popup">
      <div data-workspace-list aria-label="Workspaces"></div>
      <hr>
      <button type="button" data-manage>Workspaces verwalten</button>
    </div>
  </details>
  <dialog aria-label="Workspaces verwalten">
    <form method="dialog">
      <strong>Workspaces verwalten</strong>
      <p><button type="submit">Schließen</button></p>
    </form>
    <div data-managed-workspaces></div>
    <form data-workspace-form>
      <label>Neuer Workspace <input name="name" required maxlength="60"></label>
      <button>Erstellen</button>
    </form>
  </dialog>
</template>
<script>
  {
    const root = document.getElementById('quest-workspace-prototype');
    const template = document.getElementById('quest-workspace-picker-template');
    for (const section of root.querySelectorAll('[data-variant]')) {
      const workspaces = [
        { name: 'Arbeit', tasks: ['Entwurf besprechen', 'Review vorbereiten'] },
        { name: 'Privat', tasks: ['Fotobuch sortieren', 'Rad zur Werkstatt bringen'] }
      ];
      let active = workspaces[0];
      section.querySelector('[data-quest-picker]').append(template.content.cloneNode(true));
      const picker = section.querySelector('.quest-picker');
      const summary = picker.querySelector('summary');
      const list = section.querySelector('[data-workspace-list]');
      const dialog = section.querySelector('dialog');
      const management = dialog.querySelector('[data-managed-workspaces]');
      const create = dialog.querySelector('[data-workspace-form]');
      const tasks = section.querySelectorAll('[data-task]');

      function render() {
        summary.querySelector('[data-current-workspace]').textContent = active.name;
        summary.setAttribute('aria-label', 'Workspace wechseln · ' + active.name);
        tasks.forEach((task, index) => { task.textContent = active.tasks[index] ?? ''; });
        list.replaceChildren();
        management.replaceChildren();

        for (const workspace of workspaces) {
          const select = document.createElement('button');
          select.textContent = workspace.name;
          select.setAttribute('aria-pressed', String(workspace === active));
          select.addEventListener('click', () => {
            active = workspace;
            picker.open = false;
            render();
            summary.focus();
          });
          list.append(select);

          const row = document.createElement('form');
          const name = document.createElement('input');
          name.value = workspace.name;
          name.required = true;
          name.maxLength = 60;
          name.setAttribute('aria-label', workspace.name + ' umbenennen');
          const rename = document.createElement('button');
          rename.textContent = 'Umbenennen';
          row.addEventListener('submit', event => {
            event.preventDefault();
            if (!name.value.trim()) return;
            workspace.name = name.value.trim();
            render();
          });
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.textContent = 'Löschen';
          remove.disabled = workspaces.length === 1;
          remove.addEventListener('click', () => {
            workspaces.splice(workspaces.indexOf(workspace), 1);
            if (active === workspace) active = workspaces[0];
            render();
          });
          row.append(name, rename, remove);
          management.append(row);
        }
      }

      section.querySelector('[data-manage]').addEventListener('click', () => {
        picker.open = false;
        dialog.showModal();
      });
      dialog.addEventListener('close', () => summary.focus());
      create.addEventListener('submit', event => {
        event.preventDefault();
        const name = create.elements.namedItem('name').value.trim();
        if (!name) return;
        active = { name, tasks: [] };
        workspaces.push(active);
        create.reset();
        render();
        dialog.close();
      });
      picker.addEventListener('keydown', event => {
        if (event.key === 'Escape' && picker.open) {
          event.preventDefault();
          picker.open = false;
          summary.focus();
        }
      });
      render();
    }
  }
</script>
