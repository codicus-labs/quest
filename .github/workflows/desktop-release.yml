# Builds the macOS desktop app (Apple Silicon) for a tag desktop-v<major.minor.patch> with
# crates/quest-app/package-macos.sh and attaches the ad-hoc signed .dmg and its .sha256 to a GitHub release.
# The tag must match the version of crates/quest-app/Cargo.toml. The release is not marked as latest, so
# Obtainium keeps finding the Android release. A manual run (workflow_dispatch) is a dry run: it builds the
# .dmg and keeps it as an artifact, without a release.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# The build runs third-party code (crates); only the release job may write.
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against Cargo.toml
        run: |
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/quest-app/Cargo.toml | head -n 1)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Dry run: version $declared from crates/quest-app/Cargo.toml, no release."
            exit 0
          fi
          version="${GITHUB_REF_NAME#desktop-v}"
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version = \"$declared\" in crates/quest-app/Cargo.toml."
            exit 1
          fi

      # The toolchain and components of rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the .dmg
        run: crates/quest-app/package-macos.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: |
            target/package/*.dmg
            target/package/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist

      # A re-run after a partial failure finds the release already there and replaces the files.
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Quest for macOS $version" \
            --notes "Quest for macOS on Apple Silicon, ad-hoc signed: on first launch, right-click the app and choose Open." \
            --latest=false \
            --verify-tag
