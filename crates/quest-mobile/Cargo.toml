[package]
name = "quest-mobile"
version = "0.1.0"
description = "UniFFI layer over quest-store for native mobile UIs (Android, later iOS)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[features]
# Only for generating the Kotlin/Swift bindings; keeps clap & co. out of normal builds.
bindgen = ["uniffi/cli"]

[dependencies]
quest-domain.workspace = true
quest-capture.workspace = true
quest-protocol.workspace = true
quest-store.workspace = true
quest-view.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
thiserror.workspace = true
uniffi.workspace = true
uuid.workspace = true

# Android only: hands the JVM to the TLS verifier reqwest uses (see src/android_tls.rs).
# Same major as quest-store's reqwest pulls in, so both share one global.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier.workspace = true

[dev-dependencies]
iana-time-zone.workspace = true
quest-oidc-fake.workspace = true
quest-server.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
