[package]
name = "quest-ai-eval"
version = "0.1.0"
description = "Eval set for AI capture: synthetic German dictations with expected proposals, scored against a real model through quest-server's provider."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quest-domain.workspace = true
quest-protocol.workspace = true
quest-capture.workspace = true
quest-server.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
